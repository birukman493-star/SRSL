<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Abdigudina</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/all.min.css">
    <link href="/css/brocode-style.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-bg);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--light-text);
            padding-top: 80px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            background: var(--dark-secondary);
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 20px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header i {
            font-size: 56px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--light-text);
        }

        .header p {
            font-size: 15px;
            color: var(--gray-text);
            margin-bottom: 20px;
        }

        .error-alert {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger-color, #ef4444);
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .success-alert {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success-color, #10b981);
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            width: 100%;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-text);
            font-size: 18px;
            pointer-events: none;
            transition: color 0.3s;
            z-index: 2;
        }

        .input-control {
            width: 100%;
            padding: 16px 16px 16px 46px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            color: var(--light-text);
            background-color: var(--dark-tertiary);
            transition: all 0.2s ease;
            outline: none;
        }

        .input-control::placeholder {
            color: var(--gray-text);
        }

        .input-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.15);
            background-color: rgba(255, 255, 255, 0.03);
        }

        .input-control:focus + i {
            color: var(--primary-color);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-1);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.3);
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 200, 255, 0.4);
            color: white;
            text-decoration: none;
        }

        .back-link {
            display: block;
            text-align: center;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .password-strength {
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            margin-top: -12px;
            margin-bottom: 16px;
            border-radius: 2px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .password-strength::before {
            content: '';
            display: block;
            height: 100%;
            width: 0;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        
        .password-strength.weak::before { width: 33%; background-color: var(--danger-color); }
        .password-strength.medium::before { width: 66%; background-color: var(--warning-color); }
        .password-strength.strong::before { width: 100%; background-color: var(--success-color); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> Abdigudina
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                     <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                     <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                     <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                     <li class="nav-item"><a class="nav-link" href="/auth/login">Login</a></li>
                     <li class="nav-item"><a class="nav-link" href="/auth/register">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="header">
            <i class="fas fa-unlock-alt"></i>
            <h1>Reset Password</h1>
            <p>Create a new password for your account.</p>
        </div>

        <div class="error-alert" style="display: none;" id="dynamicAlert">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="dynamicAlertMsg"></span>
        </div>

        <% if (error) { %>
        <div class="error-alert">
            <i class="fas fa-exclamation-triangle"></i>
            <span><%= error %></span>
        </div>
        <% } %>

        <% if (success) { %>
        <div class="success-alert flex-column align-items-center text-center">
            <i class="fas fa-check-circle" style="font-size: 2rem; margin-bottom: 10px;"></i>
            <span><%= success %></span>
            <div class="mt-3">
                <a href="/<%= typeof role !== 'undefined' ? role : '' %>/dashboard" class="btn btn-outline-success border-success text-success" id="dashboardLink">
                    Go to Dashboard <span id="countdown">(3)</span>
                </a>
            </div>
        </div>
        <script>
            let count = 3;
            const countdownEl = document.getElementById('countdown');
            const dashboardLink = document.getElementById('dashboardLink');
            
            const timer = setInterval(() => {
                count--;
                if (countdownEl) {
                    countdownEl.innerText = `(${count})`;
                }
                if (count <= 0) {
                    clearInterval(timer);
                    if (dashboardLink) {
                        window.location.href = dashboardLink.href;
                    }
                }
            }, 1000);
        </script>
        <% } %>

        <% if (!success) { %>
        <form id="resetPasswordForm" action="/auth/reset-password/<%= token %>" method="POST" onsubmit="return validateBeforeSubmit(event)">
            
            <div class="input-group">
                <input type="password" id="password" name="password" class="input-control" placeholder="New Password" required oninput="checkPasswordStrength()">
                <i class="fas fa-lock"></i>
            </div>
            <div class="password-strength" id="passwordStrength"></div>
            
            <div class="input-group">
                <input type="password" id="confirmPassword" name="confirmPassword" class="input-control" placeholder="Confirm Password" required oninput="checkPasswordMatch()">
                <i class="fas fa-check-double"></i>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                Reset Password <i class="fas fa-save"></i>
            </button>
        </form>
        <% } %>

        <a href="/auth/login" class="back-link"><i class="fas fa-arrow-left me-2"></i>Back to login</a>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script>
        let passwordsMatch = false;

        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthBar = document.getElementById('passwordStrength');
            
            let strength = 0;
            if (password.length >= 8) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[a-z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            
            strengthBar.className = 'password-strength';
            if (password.length > 0) {
                if (strength <= 2) {
                    strengthBar.classList.add('weak');
                } else if (strength <= 4) {
                    strengthBar.classList.add('medium');
                } else {
                    strengthBar.classList.add('strong');
                }
            }

            if(document.getElementById('confirmPassword').value) {
                checkPasswordMatch();
            }
        }

        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const dynamicAlert = document.getElementById('dynamicAlert');
            
            if (password && confirmPassword) {
                if (password === confirmPassword) {
                    passwordsMatch = true;
                    dynamicAlert.style.display = 'none';
                } else {
                    passwordsMatch = false;
                }
            } else {
                passwordsMatch = false;
            }
        }

        function validateBeforeSubmit(event) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const dynamicAlert = document.getElementById('dynamicAlert');
            const dynamicAlertMsg = document.getElementById('dynamicAlertMsg');
            
            if (!password || !confirmPassword) {
                dynamicAlertMsg.innerText = 'Please fill in all required fields';
                dynamicAlert.style.display = 'flex';
                return false;
            }
            
            if (!passwordsMatch) {
                dynamicAlertMsg.innerText = 'Passwords do not match';
                dynamicAlert.style.display = 'flex';
                return false;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Resetting... <i class="fas fa-spinner fa-spin"></i>';
            return true;
        }
    </script>
</body>
</html>
