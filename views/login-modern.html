<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In to Abdigudina EMS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/all.min.css" />
    <link href="/css/brocode-style.css" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: var(--light-text);
        padding-top: 80px;
        /* Space for the navbar to avoid overlap */
        position: relative;
        background-color: #0f172a;
        z-index: 1;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
          url("/image/hero-bg.jpg") center/cover no-repeat;
        z-index: -2;
        animation: heroDynamicPan 30s infinite alternate
          cubic-bezier(0.45, 0.05, 0.55, 0.95);
        will-change: transform, filter;
      }

      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          45deg,
          rgba(37, 99, 235, 0.3) 0%,
          rgba(249, 115, 22, 0.3) 100%
        );
        mix-blend-mode: overlay;
        z-index: -1;
        animation: pulseGradient 15s infinite alternate ease-in-out;
        pointer-events: none;
      }

      .login-wrapper {
        width: 100%;
        max-width: 400px;
        padding: 40px 30px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.5);
        margin: 20px auto;
        position: relative;
        z-index: 10;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header i {
        font-size: 56px;
        background: var(--gradient-1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--light-text);
      }

      .header p {
        font-size: 15px;
        color: var(--gray-text);
        margin-bottom: 20px;
      }

      .error-alert {
        background-color: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: var(--danger-color, #ef4444);
        padding: 14px 20px;
        border-radius: 12px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 500;
      }

      .error-alert i {
        font-size: 16px;
      }

      .input-group {
        position: relative;
        margin-bottom: 16px;
      }

      .input-group i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gray-text);
        font-size: 18px;
        pointer-events: none;
        transition: color 0.3s;
      }

      .input-control {
        width: 100%;
        padding: 16px 16px 16px 46px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        font-size: 15px;
        color: var(--dark-text);
        background-color: #f8fafc;
        transition: all 0.2s ease;
        outline: none;
      }

      .input-control::placeholder {
        color: var(--gray-text);
      }

      .input-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        background-color: #ffffff;
      }

      .input-control:focus + i {
        color: var(--primary-color);
      }

      .submit-btn {
        width: 100%;
        padding: 16px;
        background: var(--gradient-1);
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .submit-btn:hover {
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
      }

      .submit-btn:active {
        transform: translateY(0) scale(0.97);
        box-shadow: 0 2px 5px rgba(37, 99, 235, 0.2);
      }

      .forgot-link {
        display: block;
        text-align: center;
        color: var(--primary-color);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 30px;
        transition: opacity 0.2s;
      }

      .forgot-link:hover {
        opacity: 0.8;
        text-decoration: underline;
      }

      .divider {
        height: 1px;
        background-color: rgba(0, 0, 0, 0.1);
        margin-bottom: 24px;
      }

      .register-text {
        text-align: center;
        font-size: 14px;
        color: var(--gray-text);
      }

      .register-text a {
        color: var(--light-text);
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s;
      }

      .register-text a:hover {
        color: var(--primary-color);
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <!-- Navigation Bar added back and properly padded -->
    <nav class="navbar navbar-expand-lg navbar-transparent">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-graduation-cap"></i>
          Abdigudina ES
        </a>
        <button
          class="navbar-toggler"
          type="button"
          aria-label="Toggle navigation"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/contact">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/gallery">Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/auth/login">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/auth/register">Register</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="login-wrapper">
      <div class="header">
        <i class="fas fa-graduation-cap"></i>
        <h1>Sign in to Abdigudina ES</h1>
        <p>Access your personalized dashboard.</p>
      </div>

      <% if (typeof error !=='undefined' && error) { %>
      <div class="error-alert" id="serverErrorAlert">
        <i class="fas fa-exclamation-circle"></i>
        <span> <%= error %> </span>
      </div>
      <% } %>

      <div class="error-alert" id="clientErrorAlert" style="display: none">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorMessage"></span>
      </div>

      <form id="loginForm" action="/auth/login" method="POST">
        <div class="input-group">
          <input
            type="text"
            id="username"
            name="username"
            class="input-control"
            placeholder="Username or Email"
            data-i18n-placeholder="placeholder_username"
            required
            autocomplete="username"
          />
          <i class="fas fa-user"></i>
        </div>

        <div class="input-group">
          <input
            type="password"
            id="password"
            name="password"
            class="input-control"
            placeholder="Password"
            data-i18n-placeholder="placeholder_password"
            required
            autocomplete="current-password"
          />
          <i class="fas fa-lock"></i>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span id="btnText">Sign In</span>
          <i class="fas fa-arrow-right" id="btnIcon"></i>
        </button>
      </form>

      <a href="/auth/forgot-password" class="forgot-link"
        >Forgotten your password?</a
      >

      <div class="divider"></div>

      <div class="register-text">
        Don't have an account? <a href="/auth/register">Create one now.</a>
      </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/translations.js"></script><script src="/js/brocode-script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const loginForm = document.getElementById("loginForm");
        const submitBtn = document.getElementById("submitBtn");
        const btnText = document.getElementById("btnText");
        const btnIcon = document.getElementById("btnIcon");
        const clientErrorAlert = document.getElementById("clientErrorAlert");
        const inputs = document.querySelectorAll(".input-control");

        if (loginForm) {
          loginForm.addEventListener("submit", function (e) {
            const username = document.getElementById("username")?.value;
            const password = document.getElementById("password")?.value;

            if (!username || !password) {
              e.preventDefault();
              clientErrorAlert.style.display = "flex";
              document.getElementById("errorMessage").textContent =
                "Username and password are required";
              return;
            }

            // High speed transition setup
            btnText.textContent = "Authenticating...";
            btnIcon.className = "fas fa-circle-notch fa-spin";
            submitBtn.style.pointerEvents = "none";
            submitBtn.style.opacity = "0.9";
          });
        }

        // Hide alerts instantly on typing
        inputs.forEach((input) => {
          input.addEventListener("input", function () {
            if (clientErrorAlert) clientErrorAlert.style.display = "none";
            const serverErrorAlert =
              document.getElementById("serverErrorAlert");
            if (serverErrorAlert) serverErrorAlert.style.display = "none";
          });
        });
        // Instant.page-like prefetching for ultra-high speed
        document.querySelectorAll("a").forEach((link) => {
          link.addEventListener(
            "mouseover",
            () => {
              const url = link.getAttribute("href");
              if (url && url.startsWith("/") && !url.includes("logout")) {
                const prefetchLink = document.createElement("link");
                prefetchLink.rel = "prefetch";
                prefetchLink.href = url;
                document.head.appendChild(prefetchLink);
              }
            },
            { once: true }
          );
        });
      });
    </script>
  </body>
</html>
