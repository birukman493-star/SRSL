<% const ctx = typeof academicContext !== 'undefined' ? academicContext : (typeof locals !== 'undefined' && locals.academicContext) || null; %>
<% if (ctx && ctx.academicYear) { %>
<div class="academic-context-banner d-flex flex-wrap align-items-center gap-2 mb-3" data-academic-year="<%= ctx.academicYear %>" data-semester="<%= ctx.semester %>" data-semester-label="<%= ctx.semesterLabel %>">
    <span class="badge rounded-pill bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 px-3 py-2">
        <i class="fas fa-calendar-alt me-1"></i>
        <span class="academic-year-display"><%= ctx.academicYear %></span>
    </span>
    <span class="badge rounded-pill bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25 px-3 py-2">
        <i class="fas fa-book-open me-1"></i>
        <span class="semester-display"><%= ctx.semesterLabel %></span>
    </span>
</div>
<% } %>
