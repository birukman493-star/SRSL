<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= title %> - SRSL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/all.min.css">
    <link href="/css/brocode-style.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--dark-bg);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--light-text);
            padding-top: 80px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 44px 36px;
            background: var(--dark-secondary);
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 20px auto;
        }

        .header { text-align: center; margin-bottom: 32px; }

        .badge-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--gradient-1);
            font-size: 32px;
            color: #fff;
            margin-bottom: 18px;
            box-shadow: 0 8px 24px rgba(0, 200, 255, 0.3);
        }

        .header h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; color: var(--light-text); }
        .header p  { font-size: 14px; color: var(--gray-text); }

        .error-alert {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-text);
            font-size: 17px;
            pointer-events: none;
        }

        .input-control {
            width: 100%;
            padding: 15px 16px 15px 46px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            color: var(--light-text);
            background-color: var(--dark-tertiary);
            outline: none;
            transition: all 0.2s ease;
            letter-spacing: 0.05em;
        }

        .input-control::placeholder { color: var(--gray-text); letter-spacing: 0; }

        .input-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--gradient-1);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.3);
            transition: all 0.2s ease;
        }

        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 200, 255, 0.4); }
        .submit-btn:active { transform: translateY(1px); }

        .divider { height: 1px; background-color: rgba(255,255,255,0.08); margin: 28px 0 20px; }

        .back-link {
            display: block;
            text-align: center;
            font-size: 14px;
            color: var(--gray-text);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--primary-color); }

        .security-note {
            margin-top: 18px;
            padding: 12px 16px;
            background: rgba(0,200,255,0.05);
            border: 1px solid rgba(0,200,255,0.12);
            border-radius: 10px;
            font-size: 12px;
            color: var(--gray-text);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i>
                SRSL
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/auth/login">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="header">
            <div class="badge-icon"><i class="fas fa-shield-alt"></i></div>
            <h1>Admin Access</h1>
            <p>Enter your secret code to access the administration portal.</p>
        </div>

        <% if (typeof error !== 'undefined' && error) { %>
        <div class="error-alert" id="errorAlert">
            <i class="fas fa-exclamation-circle"></i>
            <span><%= error %></span>
        </div>
        <% } %>

        <form id="adminLoginForm" action="/auth/admin" method="POST">
            <div class="input-group">
                <i class="fas fa-key input-icon"></i>
                <input
                    type="password"
                    id="secretCode"
                    name="secretCode"
                    class="input-control"
                    placeholder="Secret Access Code"
                    required
                    autocomplete="off"
                >
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="btnText">Verify & Enter</span>
                <i class="fas fa-arrow-right" id="btnIcon"></i>
            </button>
        </form>

        <div class="security-note">
            <i class="fas fa-lock" style="color: var(--primary-color);"></i>
            This portal is restricted to authorized administrators only.
        </div>

        <div class="divider"></div>

        <a href="/auth/login" class="back-link">
            <i class="fas fa-arrow-left me-1"></i> Back to regular login
        </a>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            btnText.textContent = 'Verifying...';
            btnIcon.className = 'fas fa-circle-notch fa-spin';
            btn.style.opacity = '0.85';
            btn.style.pointerEvents = 'none';
        });
    </script>
</body>
</html>
