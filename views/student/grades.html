<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= title %> - Abdigudina</title>
    
    <!-- Bootstrap CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/all.min.css">
    <!-- Google Fonts -->
    <link href="/css/inter-font.css" rel="stylesheet">
    <!-- Core Styling -->
    <link rel="stylesheet" href="/css/brocode-style.css">
</head>
<body class="dashboard-body">
    <div class="admin-container dashboard-wrapper">
        <%- include('partials/sidebar.html') %>

        <main class="main-panel w-100 p-4">
            <!-- Top Header -->
            <div class="premium-panel mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="fw-800 mb-1" style="font-size: 2.2rem; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">My Academic Progress</h1>
                        <p class="text-secondary m-0 fw-medium"><i class="fas fa-chart-bar me-2"></i>Detailed breakdown of your grades and assessments</p>
                    </div>
                    <div>
                        <button class="btn btn-primary px-4 py-2 rounded-pill shadow-sm" onclick="window.print()">
                            <i class="fas fa-print me-2"></i>Print Report
                        </button>
                    </div>
                </div>
            </div>

            <!-- Grades Content -->
            <div id="grades-container">
                <%- grades_html %>
            </div>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/brocode-script.js"></script>
    <script>
        document.getElementById('gradeSearch')?.addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const items = document.querySelectorAll('#grades-container .grade-item, #grades-container .grade-card');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(term) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
